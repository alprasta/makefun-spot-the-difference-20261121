<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Double Take — Spot the Difference</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #171a26;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }
    /* Spoken by screen readers, never shown on screen. */
    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Double Take, a spot the difference game: two pictures side by side, click the seven differences."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
